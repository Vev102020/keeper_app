retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-kotlinx-serialization-converter" }
#jetpack navigation
navigation-graph-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation-graph" }
navigation-graph-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation-graph" }
#ksp
